<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Background Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
            color: red;
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 20px;
        }

        h1 {
            font-size: 3em;
        }
    </style>
</head>
<body>

<div id="player"></div>
<div class="content">
    <h1>Your Title Here</h1>
    <p>Your content goes here.</p>
</div>

<script>
    // Load the IFrame Player API code asynchronously.
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: '7SnmCUwOsts', // Replace with your video ID
            playerVars: {
                autoplay: 1,
                loop: 1,
                playlist: '7SnmCUwOsts', // Same as videoId for looping
                controls: 0,
                showinfo: 0,
                rel: 0,
                mute: 1,
                enablejsapi: 1,
                modestbranding: 1,
                wmode: 'transparent'
            },
            events: {
                'onReady': function(event) {
                    event.target.mute(); // Mute the video for autoplay
                }
            }
        });
    }
</script>

</body>
</html>
