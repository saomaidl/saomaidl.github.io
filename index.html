<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký người dùng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      overflow: hidden; /* Ẩn thanh cuộn */
    }
    #background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Đặt video ở dưới cùng */
    }
    #play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10; /* Đảm bảo nút nằm trên video nền */
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

  <!-- Nhúng video nền bằng iframe -->
  <iframe id="background-video" 
          src="https://www.youtube.com/embed/DkGHM-N0zus?autoplay=0&mute=1&controls=0&loop=1&playlist=DkGHM-N0zus" 
          frameborder="0" 
          allow="autoplay; encrypted-media" 
          allowfullscreen>
  </iframe>

  <!-- Nút Play -->
  <button id="play-button">Play Video</button>

  <!-- JavaScript để xử lý sự kiện -->
  <script>
  document.getElementById("play-button").onclick = function() {
    var iframe = document.getElementById("background-video");
    iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    this.style.display = 'none'; // Ẩn nút Play sau khi nhấp
  };
  </script>

</body>
</html>
