<div class="bg-white fixed bottom-0 left-0 right-0 w-full flex flex-col border-t border-black border-opacity-10"><div class="z-max"><div class="flex h-[56px] items-center" id="navbar"></div></div></div>

<script>
$(document).ready(function() {
  const buttons = [
    {
      url: '/songs?play_circle',
      label: 'Play',
      icon: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 0, 'wght' 300, 'opsz' 24;">play_circle</span>`,
      iconAlt: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 1, 'wght' 300, 'opsz' 24;color: #056449;">play_circle</span>`,
    },
    {
      url: '/songs?/volume_down',
      label: 'Vol Down',
      icon: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 0, 'wght' 300, 'opsz' 24;">volume_down</span>`,
      iconAlt: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 1, 'wght' 300, 'opsz' 24;color: #056449;">volume_down</span>`,
    },
    {
      url: '/songs?/skip_next',
      label: 'Next',
      icon: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 1, 'wght' 300, 'opsz' 24;">skip_next</span>`,
      iconAlt: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 1, 'wght' 300, 'opsz' 24;color: #056449;">skip_next</span>`,
    },
    {
      url: '/songs?/volume_up',
      label: 'Vol Up',
      icon: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 0, 'wght' 300, 'opsz' 24;">volume_up</span>`,
      iconAlt: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 1, 'wght' 300, 'opsz' 24;color: #056449;">volume_up</span>`,
    },
    {
      url: '/songs?/settings',
      label: 'Settings',
      icon: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 0, 'wght' 300, 'opsz' 24;">settings</span>`,
      iconAlt: `<span class="material-symbols-rounded flex items-center justify-center" style="font-variation-settings: 'FILL' 1, 'wght' 300, 'opsz' 24;color: #056449;">settings</span>`,
    },
  ];

  buttons.forEach(button => {
    const isActive = window.location.pathname === button.url;
    $('#navbar').append(`
      <a href='${button.url}' class="flex flex-col items-center justify-center text-center flex-1 h-full ${isActive ? 'text-black' : 'text-icon'} gap-0">
        ${isActive ? button.iconAlt : button.icon}
        ${button.label ? `<span class="encore-text text-marginal leading-normal font-bold" style="font-size:10px;${isActive ? 'color: #056449;' : ''}">${button.label}</span>` : ''}
      </a>
    `);
  });
});
</script>
