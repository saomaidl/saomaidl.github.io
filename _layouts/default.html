<!DOCTYPE html>
<html lang="{{ site.lang | default: 'vi' }}">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/assets/favicon/favicon-48x48.png" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/favicon/favicon.svg" />
  <link rel="shortcut icon" href="{{ site.baseurl }}/assets/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Sao Mai" />
  <link rel="manifest" href="{{ site.baseurl }}/assets/favicon/site.webmanifest" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="black" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <link rel="alternate" href="{{ page.url | prepend: site.baseurl }}" hreflang="{{ page.lang | default: 'vi' }}">
  <link rel="canonical" href="{{ page.url | prepend: site.baseurl }}">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:locale" content="{{ site.locale | default: 'vi_VN' }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | prepend: site.baseurl }}">
  <meta property="og:site_name" content="{{ site.name }}">
  <meta property="article:modified_time" content="{{ page.date | date_to_xmlschema }}">  
  <meta name="twitter:card" content="summary_large_image">

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,100..700,0..1,0&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,100..700,0..1,0&icon_names=add_circle,favorite,home,map,subscriptions" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Google+Sans:400,500,700&amp;display=swap" rel="stylesheet" as="style" type="text/css" media="all" onload="this.media='all'" nonce="">
  <link rel="preload" href="{{ site.baseurl }}/assets/css/app.css" as="style" onload="this.rel='stylesheet'">
  <link rel="preload" href="{{ site.baseurl }}/assets/css/font.css" as="style" onload="this.rel='stylesheet'">
  
  <!-- Cấu hình Tailwind trước khi tải CDN -->
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="{{ site.baseurl }}/assets/js/tailwind-config.js" defer></script>
  
  <!-- Các thư viện khác -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  
  <!-- Các file JavaScript của bạn -->
  <script type="module" src="{{ site.baseurl }}/assets/js/firebase-config.js" defer></script>
  <script type="module" src="{{ site.baseurl }}/assets/js/loadUserData.js" defer></script>
  <script type="module" src="{{ site.baseurl }}/assets/js/songSelection.js" defer></script>
  <script src="{{ site.baseurl }}/assets/js/search.js" defer></script>
  
</head>

<body>
  <div id="__next" class="z-0 h-full w-full">
    <div>
      <div class="h-full">
        <div data-main-scrollable-node="true" class="block h-full overflow-x-hidden overflow-y-auto relative w-full">
          <div class="flex flex-col min-h-screen">
            <div class="flex flex-col flex-1 overflow-y-auto pb-0" style="margin-bottom: 57px;">
              <div class="flex flex-col min-h-full relative w-full flex-1 p-0">
                {{ content }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="content"></div>
</body>

</html>
